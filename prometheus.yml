global:
  scrape_interval: 5s # Update the dashboard every 5 seconds

scrape_configs:
  - job_name: 'iron-proxy'
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      # host.docker.internal allows the Docker container to bridge out and reach your local machine's ports
      - targets: ['host.docker.internal:9090']