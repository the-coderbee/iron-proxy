version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      # Mount the config file we just created into the container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      # Map container port 9090 to host port 9091 so it doesn't clash with your Rust app!
      - "9091:9090" 
    extra_hosts:
      # Crucial for Linux systems to resolve host.docker.internal
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
