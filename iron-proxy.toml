[server]
bind_addr = "127.0.0.1"
port = 8080

[server.tls]
cert_path = "certs/cert.pem"
key_path = "certs/key.pem"

[rate_limit]
capacity = 5.0
refill_rate = 1.0

[admin]
bind_addr = "127.0.0.1"
port = 9090

[[clusters]]
name = "main_web_pool"
mode = "tcp"
targets = ["127.0.0.1:8081", "127.0.0.1:8082", "127.0.0.1:8083"]
max_retries = 3
sticky_sessions = true

[[tcp_servers]]
bind_addr = "127.0.0.1"
port = 6000
targets = ["127.0.0.1:9000"]
