name: Build and Release

# 1. THE TRIGGER: Only run this script when you push a new version tag (e.g., v0.3.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest # 2. THE SERVER: Spin up a fresh Ubuntu machine

    steps:
      # 3. Download your code onto the GitHub server
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4. Install the Rust compiler on the GitHub server
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 5. Compile the highly optimized executable
      - name: Build Release Binary
        run: cargo build --release

      # 6. Rename the file so people know what it is
      - name: Rename Binary
        run: mv target/release/gateway iron-proxy-linux-amd64

      # 7. Upload the finished file to your GitHub Releases page
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: iron-proxy-linux-amd64