name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-upload:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: iron-proxy
            asset_name: iron-proxy-linux-amd64
            
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: iron-proxy
            asset_name: iron-proxy-macos-arm64
            
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: iron-proxy.exe
            asset_name: iron-proxy-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p iron_proxy

      - name: Upload Binary to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.bin_name }}
          name: Release ${{ github.ref_name }}
          draft: false 
          generate_release_notes: true

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Waits for all 3 binary builds to succeed before building the image
    needs: build-and-upload

    permissions:
      contents: read
      packages: write  # Required to push to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # No extra secrets needed!

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with the version e.g. v4.0.2
            type=ref,event=tag
            # Also tag as latest
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caches layers between runs to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max