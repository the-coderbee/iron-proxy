name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main
    # Only trigger the deployment if the docs or this workflow file actually change
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

# Grant the workflow permission to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from stepping on each other
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This action grabs a pre-compiled mdBook binary instantly, bypassing a 5-minute Cargo compilation
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build mdBook
        run: mdbook build
        working-directory: ./docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/book'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4