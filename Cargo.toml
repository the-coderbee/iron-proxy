[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.0", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
redis = {version = "0.25", features = ["tokio-comp"]}
deadpool-redis = "0.15"
notify = "6.1"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
bollard = "0.16"
futures-util = "0.3"
tokio-rustls = "0.25.0"
rustls = "0.22.2"
rustls-pemfile = "2.1.0"